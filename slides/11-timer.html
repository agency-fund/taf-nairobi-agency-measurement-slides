<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workshop countdown</title>
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/anim.css">
<link rel="stylesheet" href="shared/taf.css">
<style>
  body.dark .slide { position: relative; align-items: center; padding: 90px 120px 64px;
    background: radial-gradient(120% 120% at 30% 20%, #0B2341, #061A2E 75%); }
  .topbar { position: absolute; top: 64px; left: 120px; }
  .d-eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 10px; }
  .tm-ring { position: relative; width: 560px; height: 560px; margin-top: 6px; }
  .tm-ring svg { width: 560px; height: 560px; display: block; }
  .tm-ring .track { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 16; }
  .tm-ring .prog { fill: none; stroke: var(--gold); stroke-width: 16; stroke-linecap: round;
    transition: stroke-dashoffset 0.2s linear; }
  .tm-digits { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .tm-digits .clk { margin: 0; font-size: 128px; font-weight: 900; color: var(--white);
    line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .tm-digits .st { margin: 14px 0 0; font-size: 22px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--slate-blue); }
  body.tm-done .tm-digits .clk { color: var(--gold); }
  body.tm-done .tm-digits .st { color: var(--gold); }
  @keyframes tm-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
  body.tm-done .tm-ring { animation: tm-pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { body.tm-done .tm-ring { animation: none; } }

  .tm-controls { margin-top: 34px; display: flex; align-items: center; gap: 44px; }
  .tm-group { display: flex; align-items: center; gap: 12px; }
  .tm-group .glab { font-size: 17px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--slate-blue); margin: 0 6px 0 0; }
  .tm-btn { font-family: var(--font); font-size: 22px; font-weight: 700; color: var(--white);
    background: transparent; border: 2px solid rgba(255,255,255,0.35); border-radius: 9999px;
    padding: 12px 26px; cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    font-variant-numeric: tabular-nums; }
  .tm-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.6); }
  .tm-btn.active { border-color: var(--gold); color: var(--gold); }
  .tm-btn.primary { background: var(--gold); border-color: var(--gold); color: var(--navy-deep); padding: 12px 40px; }
  .tm-btn.primary:hover { background: var(--gold-warm); border-color: var(--gold-warm); }
  .tm-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body class="dark">
  <div class="slide">
    <div class="topbar" data-reveal>
      <span class="wordmark">The Agency Fund</span>
    </div>
    <p class="d-eyebrow" data-reveal>Part 2 &middot; Workshop clock</p>

    <div class="tm-ring" data-reveal="scale">
      <svg viewBox="0 0 560 560">
        <circle class="track" cx="280" cy="280" r="256"/>
        <circle class="prog" id="tmProg" cx="280" cy="280" r="256"
          stroke-dasharray="1608.5" stroke-dashoffset="0" transform="rotate(-90 280 280)"/>
      </svg>
      <div class="tm-digits">
        <p class="clk" id="tmClock">20:00</p>
        <p class="st" id="tmState">Ready</p>
      </div>
    </div>

    <div class="tm-controls" data-reveal>
      <div class="tm-group">
        <span class="glab">Set</span>
        <button class="tm-btn" type="button" data-min="5">5 min</button>
        <button class="tm-btn" type="button" data-min="10">10 min</button>
        <button class="tm-btn" type="button" data-min="15">15 min</button>
        <button class="tm-btn active" type="button" data-min="20">20 min</button>
      </div>
      <div class="tm-group">
        <button class="tm-btn" type="button" id="tmMinus">&minus;1 min</button>
        <button class="tm-btn" type="button" id="tmPlus">+1 min</button>
      </div>
      <div class="tm-group">
        <button class="tm-btn primary" type="button" id="tmStart">Start</button>
        <button class="tm-btn" type="button" id="tmReset">Reset</button>
      </div>
    </div>
  </div>
<script src="shared/anim.js"></script>
<script>
(function () {
  var C = 2 * Math.PI * 256;
  var total = 20 * 60, remaining = total, running = false, endAt = 0, tick = null;
  var clock = document.getElementById('tmClock');
  var state = document.getElementById('tmState');
  var prog = document.getElementById('tmProg');
  var startBtn = document.getElementById('tmStart');
  var presets = document.querySelectorAll('.tm-btn[data-min]');

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60), ss = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function render() {
    clock.textContent = fmt(remaining);
    var frac = total > 0 ? Math.max(0, remaining) / total : 0;
    prog.style.strokeDashoffset = String(C * (1 - frac));
  }
  function pause(label) {
    running = false;
    if (tick) { clearInterval(tick); tick = null; }
    startBtn.textContent = 'Start';
    state.textContent = label || 'Paused';
  }
  function step() {
    remaining = (endAt - Date.now()) / 1000;
    if (remaining <= 0) {
      remaining = 0;
      pause('Time is up');
      document.body.classList.add('tm-done');
    }
    render();
  }
  function start() {
    if (remaining <= 0) { remaining = total; document.body.classList.remove('tm-done'); }
    running = true;
    endAt = Date.now() + remaining * 1000;
    startBtn.textContent = 'Pause';
    state.textContent = 'Running';
    document.body.classList.remove('tm-done');
    tick = setInterval(step, 200);
    render();
  }
  function reset() {
    pause('Ready');
    remaining = total;
    document.body.classList.remove('tm-done');
    render();
  }
  function clearPresets() {
    for (var i = 0; i < presets.length; i++) presets[i].classList.remove('active');
  }

  startBtn.addEventListener('click', function () {
    if (running) pause(); else start();
    startBtn.blur();
  });
  document.getElementById('tmReset').addEventListener('click', function () { reset(); this.blur(); });
  document.getElementById('tmPlus').addEventListener('click', function () {
    total += 60;
    if (running) { endAt += 60000; step(); }
    else { remaining = Math.min(total, remaining + 60); state.textContent = 'Ready'; document.body.classList.remove('tm-done'); render(); }
    clearPresets(); this.blur();
  });
  document.getElementById('tmMinus').addEventListener('click', function () {
    total = Math.max(60, total - 60);
    if (running) { endAt = Math.max(Date.now(), endAt - 60000); step(); }
    else { remaining = Math.max(0, Math.min(total, remaining - 60)); render(); }
    clearPresets(); this.blur();
  });
  for (var i = 0; i < presets.length; i++) {
    presets[i].addEventListener('click', function () {
      total = parseInt(this.getAttribute('data-min'), 10) * 60;
      clearPresets(); this.classList.add('active');
      reset(); this.blur();
    });
  }
  render();
})();
</script>
<script>
/* Deck-shell integration. Keep verbatim. */
(function () {
  if (window.parent === window) return;
  document.addEventListener('keydown', function (e) {
    var nav = ['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'Home', 'End', 'Escape'];
    if (nav.indexOf(e.key) !== -1 || /^[1-9]$/.test(e.key) || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      window.parent.postMessage({ deckKey: e.key }, '*');
    }
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { window.parent.postMessage({ deckFontsReady: true }, '*'); });
  } else { window.parent.postMessage({ deckFontsReady: true }, '*'); }
})();
</script>
</body>
</html>
